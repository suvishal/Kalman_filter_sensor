[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kalman-research"
version = "0.1.0"
description = "From-scratch Kalman filter sensor fusion study: tuning sensitivity, consistency, and adaptive noise estimation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10", "matplotlib>=3.7"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
kalman-research = "kalman_research.experiments.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
